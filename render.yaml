services:
  - type: web
    name: clear-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CLEAR_DATABASE_URL
        sync: false
      - key: CLEAR_OPERATOR_TOKEN
        generateValue: true
      - key: CLEAR_CITIZEN_TOKEN
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      - key: CLEAR_RAIN_CLOG_ENABLED
        value: "1"
      - key: CLEAR_WEATHER_UNION_API_KEY
        sync: false

