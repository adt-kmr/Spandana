services:
  - type: web
    name: clear-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CLEAR_DATABASE_URL
        sync: false
      - key: CLEAR_OPERATOR_TOKEN
        generateValue: true
      - key: CLEAR_CITIZEN_TOKEN
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
