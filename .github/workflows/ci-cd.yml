name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref so we never deploy a stale commit.
concurrency:
  group: clear-cicd    
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      # Advisory only: report style issues but never fail the pipeline (--exit-zero), so a
      # lint nit can't block a hackathon deploy.
      - name: Ruff
        run: ruff check backend/ --exit-zero

  test:
    name: Tests (pytest) + boot smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLEAR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # LightGBM needs the OpenMP runtime even to import.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - name: Install package (with dev extras)
        run: pip install --upgrade pip && pip install "./backend[dev]"
      # Real suite. DB-backed tests run against the throwaway Postgres service above; pure unit
      # tests need no DB (conftest.py blocks DB tests against non-local URLs). A non-zero exit
      # fails the job and blocks deploy.
      - name: Pytest
        run: cd backend && pytest -q
      # Self-contained boot check: builds the real app and asserts /healthz == ok via FastAPI's
      # TestClient (exercises lifespan startup, no network server). Independent of seed CSV or
      # trained models -> models may report false, but the app MUST still boot and serve.
      - name: Boot + /healthz
        run: |
          cd backend
          python - <<'PY'
          from fastapi.testclient import TestClient
          from clear.app import app

          with TestClient(app) as client:
              r = client.get("/healthz")
              assert r.status_code == 200, r.status_code
              body = r.json()
              assert body["status"] == "ok", body
              print("healthz OK:", body)
          PY

  deploy:
    name: Deploy (Render)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Triggers a Render deploy via its Deploy Hook. Store the hook URL as the repo secret
      # RENDER_DEPLOY_HOOK_URL (Render -> service -> Settings -> Deploy Hook). If the secret is
      # absent the step logs and exits 0, so forks/PRs without the secret never fail.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ""  # set via repo secret; enable by following the blue "One-time wiring" note below. Ships empty so an unconfigured repo safely SKIPS deploy (the -z check below).       
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered."
